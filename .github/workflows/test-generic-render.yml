name: Test generic Visual Spec renderer

on:
  push:
    paths:
      - 'examples/arbitrary-visual-spec.json'
      - 'src/**'
      - 'orchestrator/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  test-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: python orchestrator/render.py examples/arbitrary-visual-spec.json --project-dir test-output --concurrency 2
      - name: Verify outputs
        run: |
          test -f test-output/manifest.json
          test -f test-output/overlays/V001__00m00s000-00m03s500__three-objects-converge.mp4
          test -f test-output/overlays/V002__00m03s500-00m07s750__independent-second-scene.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: arbitrary-generic-render-test
          path: test-output/
