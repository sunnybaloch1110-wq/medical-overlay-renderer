name: Render visual specification

on:
  workflow_dispatch:
    inputs:
      visual_spec:
        description: Path to the Visual Spec JSON
        required: true
        default: examples/visual-spec.sample.json
      concurrency:
        description: Remotion render concurrency
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck renderer
        run: npm run typecheck

      - name: Render supplied Visual Spec
        run: python orchestrator/render.py "${{ inputs.visual_spec }}" --project-dir workflow-output --concurrency "${{ inputs.concurrency }}"

      - name: Upload rendered overlays and manifest
        uses: actions/upload-artifact@v4
        with:
          name: visual-spec-render
          path: workflow-output/
          if-no-files-found: error
